<!doctype html>
<html><head><meta charset="utf-8">
<style>@font-face{font-family:Baloo;src:url(../assets/baloo2-800.woff2) format('woff2');font-weight:800}
html,body{margin:0;background:#000;overflow:hidden}svg{display:block}</style></head>
<body><svg id="tela" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="personagens.js"></script><script src="cenarios.js"></script>
<script>
// Prévia de cada cenário com personagens: abrir com ?c=quarto|quartoNoite|morro|varanda|betania
const base = { t: 1, passo: 0, pisca: 0, boca: 0, inclina: 0, olhar: [0, 0] };
const P = {
  quarto: t => quarto(t, { hora: 10.2 }) + algodao({ ...base, x: 1500, y: 1000, esc: 1.4 }) +
    davi({ ...base, x: 820, y: 1010, esc: 1.55, segura: 'controle', bracoE: -24, bracoD: -24, olhar: [-0.3, -0.6] }),
  quartoNoite: t => quarto(t, { noite: true, hora: 9.5 }) + vovo({ x: 1240, y: 1000, esc: 1.45, bracoE: 8, bracoD: 40, olhar: [-1, 0], pisca: 0, boca: 0, inclina: -4 }) +
    davi({ ...base, x: 780, y: 1010, esc: 1.55, segura: 'controle', bracoE: -24, bracoD: -24, olhar: [-0.3, -0.6] }),
  morro: t => morro(t) + davi({ ...base, x: 900, y: 860, esc: 1.5, bracoE: 10, bracoD: 10, olhar: [-1, 0.6], sobr: 1 }) +
    algodao({ ...base, x: 300, y: 930, esc: 1.3, inclina: -10 }),
  varanda: t => varanda(t) + vovo({ x: 1330, y: 950, esc: 1.5, bracoE: 8, bracoD: 35, olhar: [-1, 0], pisca: 0, boca: 0, inclina: 3 }) +
    davi({ ...base, x: 620, y: 990, esc: 1.55, bracoE: 10, bracoD: 10, olhar: [1, -0.4], sobr: .5 }) + algodao({ ...base, x: 330, y: 1000, esc: 1.35 }),
  betania: t => betania(t) + marta({ x: 300, y: 980, esc: 1.35, bracoE: -38, bracoD: 20, olhar: [1, 0], bravo: true }) +
    jesus({ x: 1000, y: 960, esc: 1.45, bracoE: 40, bracoD: 40 }) + maria({ x: 1330, y: 990, esc: 1.35, bracoE: -30, bracoD: -30, olhar: [-1, -0.4] }),
};
const c = new URLSearchParams(location.search).get('c') || 'quarto';
document.getElementById('tela').innerHTML = P[c](1.0);
</script></body></html>
